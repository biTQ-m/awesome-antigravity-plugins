name: Submit an Antigravity Plugin
description: Suggest a new open-source or Marketplace plugin for Awesome Antigravity Plugins
title: "[Plugin]: "
labels: ["plugin-submission"]
body:
  - type: input
    id: name
    attributes:
      label: Plugin Name
      placeholder: e.g. AGY Floating HUD
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: Repository URL or Marketplace Catalog ID
      placeholder: https://github.com/owner/repo or antigravity-plugins-partners/plugin/...
    validations:
      required: true
  - type: dropdown
    id: category
    attributes:
      label: Category
      options:
        - Desktop UI, Auxiliary Pane & HUDs
        - Telemetry, Context Window & Statuslines
        - Performance, Memory, Workflow & Swarm Orchestration
        - Browser, Computer Use & Creative Automation
        - Cross-Agent Bridges, ACP & Remote Control
        - Official & Partner Marketplace Catalog
        - Skill Suites & Plugin Authoring Toolkits
        - Environment & Multi-Account Managers
        - Localization, Themes & Accessibility
    validations:
      required: true
  - type: checkboxes
    id: surfaces
    attributes:
      label: Extension Surfaces Used
      options:
        - label: plugin.json manifest
        - label: Auxiliary Pane / Sidebar UI Sidecar (sidecars/)
        - label: Interactive MCP App (ui:// resource via @modelcontextprotocol/ext-apps)
        - label: Skills (skills/<name>/SKILL.md)
        - label: MCP Server (mcp_config.json)
        - label: Lifecycle Hooks (hooks.json)
        - label: Prompt Rules (rules/AGENTS.md)
        - label: CLI statusLine / ACP
  - type: textarea
    id: description
    attributes:
      label: Short Description (English &/or Chinese)
      description: 1–2 concise sentences explaining what the plugin solves and supported OS platforms.
    validations:
      required: true
  - type: checkboxes
    id: compliance
    attributes:
      label: Security Check
      options:
        - label: Source code is transparent and free of credential/token harvesting or hidden telemetry.
          required: true
