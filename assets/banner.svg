<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 240" width="960" height="240" role="img" aria-label="Awesome Antigravity Plugins">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1020"/>
      <stop offset="50%" stop-color="#131b38"/>
      <stop offset="100%" stop-color="#1b1438"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="50%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>
    <linearGradient id="orb" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <radialGradient id="glowLeft" cx="20%" cy="50%" r="45%">
      <stop offset="0%" stop-color="#4f46e5" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#4f46e5" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowRight" cx="85%" cy="30%" r="40%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Card background -->
  <rect width="960" height="240" rx="20" fill="url(#bg)"/>
  <rect width="960" height="240" rx="20" fill="url(#glowLeft)"/>
  <rect width="960" height="240" rx="20" fill="url(#glowRight)"/>
  <rect x="1" y="1" width="958" height="238" rx="19" fill="none" stroke="#ffffff" stroke-opacity="0.1"/>

  <!-- Subtle grid dots -->
  <g fill="#94a3b8" fill-opacity="0.16">
    <circle cx="48" cy="40" r="1.5"/><circle cx="88" cy="40" r="1.5"/><circle cx="128" cy="40" r="1.5"/>
    <circle cx="48" cy="80" r="1.5"/><circle cx="88" cy="80" r="1.5"/><circle cx="128" cy="80" r="1.5"/>
    <circle cx="832" cy="160" r="1.5"/><circle cx="872" cy="160" r="1.5"/><circle cx="912" cy="160" r="1.5"/>
    <circle cx="832" cy="200" r="1.5"/><circle cx="872" cy="200" r="1.5"/><circle cx="912" cy="200" r="1.5"/>
  </g>

  <!-- Orbital Antigravity Emblem (Left) -->
  <g transform="translate(132, 120)">
    <ellipse cx="0" cy="0" rx="68" ry="26" transform="rotate(-24)" fill="none" stroke="#60a5fa" stroke-opacity="0.45" stroke-width="1.75"/>
    <ellipse cx="0" cy="0" rx="68" ry="26" transform="rotate(32)" fill="none" stroke="#c084fc" stroke-opacity="0.45" stroke-width="1.75"/>
    <circle cx="0" cy="0" r="30" fill="url(#orb)"/>
    <!-- Upward Antigravity Chevron -->
    <path d="M-11 7 L0 -11 L11 7 M-6 12 L6 12" fill="none" stroke="#ffffff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Satellite plugin nodes -->
    <circle cx="-56" cy="-22" r="6" fill="#38bdf8"/>
    <circle cx="54" cy="-26" r="5.5" fill="#f472b6"/>
    <circle cx="46" cy="34" r="5" fill="#34d399"/>
    <circle cx="-42" cy="36" r="4.5" fill="#fbbf24"/>
  </g>

  <!-- Typography (Right) -->
  <g transform="translate(244, 0)">
    <!-- Pill tag -->
    <rect x="0" y="42" width="234" height="26" rx="13" fill="#1e293b" stroke="#6366f1" stroke-opacity="0.5"/>
    <circle cx="15" cy="55" r="4" fill="#34d399"/>
    <text x="27" y="59" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" letter-spacing="0.6" fill="#cbd5e1">GOOGLE ANTIGRAVITY ECOSYSTEM</text>

    <!-- Main Title -->
    <text x="0" y="114" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="40" font-weight="800" letter-spacing="-0.8" fill="#f8fafc">Awesome <tspan fill="url(#accent)">Antigravity</tspan> Plugins</text>

    <!-- Subtitle -->
    <text x="0" y="148" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="15.5" font-weight="400" fill="#94a3b8">Curated UI Sidecars, MCP Apps, HUDs, Statuslines, Skills &amp; Marketplace Extensions</text>

    <!-- Component Badges -->
    <g transform="translate(0, 172)" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11.5" font-weight="600">
      <rect x="0" y="0" width="92" height="26" rx="6" fill="#1e293b" stroke="#334155"/>
      <text x="46" y="17" text-anchor="middle" fill="#93c5fd">UI Sidecars</text>

      <rect x="100" y="0" width="84" height="26" rx="6" fill="#1e293b" stroke="#334155"/>
      <text x="142" y="17" text-anchor="middle" fill="#67e8f9">MCP Apps</text>

      <rect x="192" y="0" width="96" height="26" rx="6" fill="#1e293b" stroke="#334155"/>
      <text x="240" y="17" text-anchor="middle" fill="#c4b5fd">MCP Servers</text>

      <rect x="296" y="0" width="76" height="26" rx="6" fill="#1e293b" stroke="#334155"/>
      <text x="334" y="17" text-anchor="middle" fill="#f9a8d4">SKILL.md</text>

      <rect x="380" y="0" width="104" height="26" rx="6" fill="#1e293b" stroke="#334155"/>
      <text x="432" y="17" text-anchor="middle" fill="#6ee7b7">Hooks &amp; Rules</text>

      <rect x="492" y="0" width="110" height="26" rx="6" fill="#1e293b" stroke="#334155"/>
      <text x="547" y="17" text-anchor="middle" fill="#fcd34d">CLI Statuslines</text>
    </g>
  </g>
</svg>
